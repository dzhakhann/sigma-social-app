name: sigma_social_app
description: "Sigmacta - Flutter Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  socket_io_client: ^2.0.0
  cupertino_icons: ^1.0.6
  image_picker: ^1.0.4
  http_parser: ^4.0.2
  video_player: ^2.8.3
  cached_network_image: ^3.3.1
  timeago: ^3.6.0
  record: 5.2.0
  audioplayers: ^6.0.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  camera: ^0.10.5+9
  shared_preferences: ^2.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  matrix: ^7.4.0
  flutter_vodozemac: ^0.5.0
  sqflite: ^2.4.2
  path: ^1.9.0
  share_plus: ^10.0.0
  url_launcher: ^6.2.0

dependency_overrides:
  # record_linux 0.7.2 (its latest) only implements platform-interface 1.2.0,
  # so pin the whole record stack to a consistent, compiling set.
  record_platform_interface: 1.2.0
  record_android: 1.3.0
  record_web: 1.1.4
  record_windows: 1.0.4
  record_linux: 0.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# Run `dart run flutter_launcher_icons` to (re)generate Android & iOS app icons.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/sigma_maskable.png"
  adaptive_icon_background: "#2D5BFF"
  adaptive_icon_foreground: "assets/icon/sigma_fg.png"
  web:
    generate: false
