    Landing gate — the ONLY thing Android, desktop, and search engines ever see.
    ==========================================================================
    The web app is iPhone-only, full stop: Android has (closed-testing) Google
    Play and, once verified, App Links open it directly without ever touching a
    browser; desktop has no distribution story at all yet. So for everyone
    except iOS Safari, this card — logo, tagline, features, a Google Play link —
    IS the site, and main.dart.js is never even downloaded (see bootFlutter()
    below, only ever called for iOS).

    Deliberately plain HTML/CSS rather than part of the Flutter app: it has to be
    on screen INSTANTLY, before anything else downloads over mobile data. Doing
    it inside Flutter would mean showing a blank page first — exactly the moment
    a visitor decides the link is broken.

    For iOS, the deep link is preserved: nothing here navigates away, so
    continuing to the web version keeps the same URL and the app routes it
    normally.

    (function () {
      var burger = document.getElementById('g-nav-burger');
      var menu = document.getElementById('g-nav-menu');
      if (burger && menu) {
        burger.addEventListener('click', function () {
          var open = menu.classList.toggle('g-nav-open');
          burger.classList.toggle('g-nav-burger-open', open);
          burger.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        menu.querySelectorAll('[data-scroll]').forEach(function (a) {
          a.addEventListener('click', function (e) {
            e.preventDefault();
            var target = document.querySelector(a.getAttribute('href'));
            menu.classList.remove('g-nav-open');
            burger.classList.remove('g-nav-burger-open');
            burger.setAttribute('aria-expanded', 'false');
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
        });
      }

      var heroDl = document.getElementById('g-hero-dl');

        heroDl.addEventListener('click', function () {
          var target = document.getElementById('g-cta-section');
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      }

      var ruBtn = document.getElementById('g-lang-ru');
      var enBtn = document.getElementById('g-lang-en');
      var current = '';
      try { current = localStorage.getItem('sigLang') || ''; } catch (e) {}
      if (!current) current = (navigator.language || '').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en';
      if (ruBtn && enBtn) {
        ruBtn.classList.toggle('g-lang-active', current === 'ru');
        enBtn.classList.toggle('g-lang-active', current === 'en');
        ruBtn.addEventListener('click', function () {
          try { localStorage.setItem('sigLang', 'ru'); } catch (e) {}
          location.reload();
        });
        enBtn.addEventListener('click', function () {
          try { localStorage.setItem('sigLang', 'en'); } catch (e) {}
          location.reload();
        });
      }
    })();
